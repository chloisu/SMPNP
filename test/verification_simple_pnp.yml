case: "verificaion_simple_pnp"
output_directory : "verification_simple_pnp"
pnp_type: "PNP"
grid_type: "equally_spaced_1d"

grid:
  equally_spaced_1d:
    pore_radius : 10e-9

non_dim:
    L_REF : 10e-9

species_parameters:
  species : [2,3]
  diffusivities : [5e-9,5e-9]

boundary_conditions:
  dirichlet:
    species : [1,2,3]
    boundary_indices : [[1,2],[2],[2]]
    boundary_values : [[0.3,0.0],[1.0],[1.0]]

initial_conditions:
  initialize_concentration_gradient : False