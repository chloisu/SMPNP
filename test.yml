case: "test_case"
grid_type: "nano_slit_with_reservoirs_2d"

grid:
  nano_slit_with_reservoirs_2d:
    pore_radius : 10e-9
    pore_length : 50e-9
    reservoir_height: 80e-9

boundary_conditions:
  dirichlet:
    species : [1,2,3]
    boundary_indices : [[1,3],[1],[1,4]]
    boundary_values : [[0,12],[1.0],[1.0,1.1]]

solver_parameters:
  verbose: true
  reltol_linear: 1e-8

