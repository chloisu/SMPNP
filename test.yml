case: "test_case"
output_directory: "test"
grid_type: "aligned_nano_slit_with_unstructured_reservoirs_2d"
pnp_type : "SMPNP"

grid:
  aligned_nano_slit_with_unstructured_reservoirs_2d:
    pore_radius : 10e-9
    pore_length : 50e-9
    reservoir_height: 80e-9

non_dim:
    L_REF : 50e-9

species_parameters:
  species : [2,3]
  solvent_size : 0.275e-9
  ion_sizes : [0.254e-9,0.076e-9]
  diffusivities : [2e-10,2e-10]

boundary_conditions:
  dirichlet:
    species : [1,2,3]
    boundary_indices : [[5,1],[5],[5,9]]
    boundary_values : [[0.0,38.7],[1.0],[1.0,1.1]]
    

time_parameters:
  plot_time_interval : 500e-9
  max_timestep: 1.25e-5

