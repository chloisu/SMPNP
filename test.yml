    pore_radius : 10e-9
    pore_length : 50e-9
    reservoir_height: 80e-9

species_parameters:
  species : [2,3]
  solvent_size : 5e-10
  ion_sizes : [5e-10,5e-10]
  diffusivities : [5e-9,5e-9]

boundary_conditions:
  dirichlet:
    species : [1,2,3]
    boundary_indices : [[1,3],[1],[1,4]]
    boundary_values : [[0.0,11.8],[1.0],[1.0,1.1]]

